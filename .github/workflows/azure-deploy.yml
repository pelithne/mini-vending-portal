name: Deploy to Azure App Service with Sidecar

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: portal-app-rg # Replace with your resource group name
      APP_SERVICE_PLAN: portal-app-service-plan # Replace with your App Service Plan name
      APP_NAME: pelithne-portal-app # Replace with your App Service name
      LOCATION: swedencentral # Replace with your Azure region (e.g., eastus, westeurope)
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: ./repo  # Clone the repository into the "repo" directory

    # Debugging step to list the directory structure
      - name: List files
        run: |
          pwd
          ls -R

      # Step 2: Log in to Azure using the federated credential
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Build the Frontend
      - name: Build Frontend
        run: |
          cd ./repo/src/frontend
          pwd
          npm install
          npm run build

      # Step 4: Deploy the Frontend to the Main App
      - name: Deploy Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: production
          package: ./repo/src/frontend/build

      # Step 5: Deploy the Backend to the App Service File System
      - name: Deploy Backend
        run: |
          # Zip the backend code
          zip -r backend.zip ./repo/src/backend

          # Deploy the backend code to the App Service file system
          az webapp deployment source config-zip \
            --resource-group $RESOURCE_GROUP \
            --name $APP_NAME \
            --src backend.zip

      # Step 6: Configure the Sidecar Using Azure REST API
      - name: Configure Sidecar
        run: |
          # Define the sidecar configuration
          SIDE_CAR_CONFIG=$(cat <<EOF
          {
            "properties": {
              "siteConfig": {
                "linuxFxVersion": "NODE|18-lts",
                "sidecars": [
                  {
                    "name": "sidecar",
                    "properties": {
                      "command": ["node", "/home/site/wwwroot/backend/server.js"],
                      "environmentVariables": [
                        {
                          "name": "SIDE_CAR_ENV_VAR",
                          "value": "example"
                        }
                      ]
                    }
                  }
                ]
              }
            }
          }
          EOF
          )

          # Update the App Service configuration using Azure REST API
          curl -X PUT \
            -H "Authorization: Bearer $(az account get-access-token --query accessToken -o tsv)" \
            -H "Content-Type: application/json" \
            -d "$SIDE_CAR_CONFIG" \
            https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$APP_NAME/config/web?api-version=2022-03-01